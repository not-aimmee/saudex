name: Optimize Images

on:
  push:
    branches: [main]
    paths:
      - 'public/images/**'
      - 'src/**/*.{png,jpg,jpeg}'

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Optimize images
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jpegOptimization: 85
          jpegProgressive: true
          webp: true